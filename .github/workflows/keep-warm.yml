name: Keep API warm

# Pings /health (a real DB round-trip, not a static route) every 5 minutes
# during 6am-midnight IST, so the Vercel function and its connection pool
# stay warm through real usage hours.
#
# This was written for Neon, whose compute auto-suspended after 5 minutes
# idle; the database moved to RDS on 2026-10-08 and a provisioned instance
# never suspends, so that half of the rationale is gone. What remains is the
# Vercel lambda cold start, which is why the schedule is unchanged. Still
# deliberately NOT 24/7 — there is no real traffic overnight, and the old
# Neon free-tier CU budget is no longer what caps it.
#
# Cron is in UTC; IST is UTC+5:30, so 6:00am-midnight IST = 00:30-18:30 UTC.
# Split into 3 entries to express that half-hour offset in POSIX cron:
on:
  schedule:
    - cron: "30-55/5 0 * * *"  # 00:30-00:55 UTC = 6:00am-6:25am IST
    - cron: "*/5 1-17 * * *"   # 01:00-17:55 UTC = 6:30am-11:25pm IST
    - cron: "0-30/5 18 * * *"  # 18:00-18:30 UTC = 11:30pm-midnight IST
  workflow_dispatch: {} # allows a manual run from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -o /dev/null -w "health check: %{http_code} in %{time_total}s\n" \
            https://unified-faith-service.vercel.app/health
